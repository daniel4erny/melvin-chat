services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PASSWORD: ${PASSWORD:?set PASSWORD in .env}
    healthcheck:
      # probe with bun itself so it does not depend on curl/wget in the image
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  livechat_api:
    build: ./api
    restart: unless-stopped
    environment:
      PASSWORD: ${PASSWORD:?set PASSWORD in .env}
      DB_PATH: /data/domat.db
    volumes:
      - livechat_data:/data
    healthcheck:
      # plain GET without upgrade returns "WebSocket Server is alive!"
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  livechat_data:
