name: Build apps

# Builds the Tauri shell for the platforms that cannot be built on the Linux
# dev machine: Windows, macOS and iOS (simulator, unsigned).
# Android and Linux are built locally; artifacts go to .releases/ (gitignored).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Tauri CLI
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: desktop
        run: bunx tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: melvin-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Tauri CLI
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: desktop
        run: bunx tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: melvin-macos
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  ios:
    name: iOS (unsigned simulator app)
    runs-on: macos-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Tauri CLI
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Initialize iOS project
        working-directory: desktop
        run: bunx tauri ios init --ci

      # Simulator builds do not need an Apple Developer certificate.
      # A build for a real iPhone requires an Apple signing identity and
      # provisioning profile; see desktop/README.md.
      - name: Build (simulator)
        working-directory: desktop
        run: bunx tauri ios build --debug --target aarch64-sim --ci

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/releases/ios"
          find desktop/src-tauri/gen/apple desktop/src-tauri/target \
            -type d -name '*.app' -prune \
            -exec cp -R {} "$GITHUB_WORKSPACE/releases/ios/" \;
          find desktop/src-tauri/gen/apple desktop/src-tauri/target \
            -type f -name '*.ipa' \
            -exec cp {} "$GITHUB_WORKSPACE/releases/ios/" \;
          find "$GITHUB_WORKSPACE/releases/ios" -maxdepth 2 -print
          test -n "$(find "$GITHUB_WORKSPACE/releases/ios" -name '*.app' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: melvin-ios
          if-no-files-found: error
          path: releases/ios/**
