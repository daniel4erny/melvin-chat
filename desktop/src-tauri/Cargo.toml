[package]
name = "melvin"
version = "0.1.0"
description = "Melvin – soukromý chat pro partu"
authors = ["Melvin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "melvin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
